<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Rock Paper Scissors</h1>
            <p>First to 5 points wins the game!</p>
        </header>

        <div class="scoreboard">
            <div class="score-card">
                <h2 id="human-score">0</h2>
                <p>Player</p>
            </div>
            <div class="score-card">
                <h2 id="computer-score">0</h2>
                <p>Computer</p>
            </div>
        </div>

        <div class="message-container">
            <p id="round-message">Choose your weapon!</p>
        </div>

        <div class="choices">
            <button id="rock" class="choice-btn">✊ Rock</button>
            <button id="paper" class="choice-btn">✋ Paper</button>
            <button id="scissors" class="choice-btn">✌️ Scissors</button>
        </div>

        <div class="reset-container hidden" id="reset-container">
            <p id="game-over-message"></p>
            <button id="reset-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
